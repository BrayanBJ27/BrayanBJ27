# Ruta en tu repo: .github/workflows/profile-3d.yml
name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 */24 * * *"   # 1 vez al día
  workflow_dispatch:          # botón manual (1ra vez)
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - name: Generar calendario 3D
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Publica los SVG en una rama aparte (main queda limpio)
      - name: Push a la rama output-3d-contrib
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-3d-contrib
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
